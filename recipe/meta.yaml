{% set c_compiler = compiler('c').split('_')[0] %}
{% set cxx_compiler = compiler('cxx').split('_')[0] %}
{% set fortran_compiler = compiler('fortran').split('_')[0] %}

{% set commands = {
  'c-compiler': {
    'gcc': ['cc', 'cpp', 'gcc', 'gcc-ar', 'gcc-nm',
              'gcc-ranlib', 'gcov', 'gcov-dump', 'gcov-tool'],
    'clang': ['clang'],
    'vs2008': [],
    'vs2010': [],
    'vs2015': [],
    'vs2019': [],
  }[c_compiler],
  'cxx-compiler': {
    'gxx': ['g++', 'c++'],
    'clangxx': ['clang++'],
    'vs2008': [],
    'vs2010': [],
    'vs2015': [],
    'vs2019': [],
  }[cxx_compiler],
  'fortran-compiler': {
    'gfortran': ['gfortran'],
    'intel-fortran' : ['ifort'],
  }[fortran_compiler],
} %}


package:
  name: compilers
  version: 1.9.0

build:
   number: 0

outputs:
  - name: c-compiler
    build:
      script: |
        # Create placeholder file to ensure package is not empty
        mkdir -p ${PREFIX}/share/compilers  # [unix]
        echo "C compiler metapackage" > ${PREFIX}/share/compilers/c-compiler.txt  # [unix]
        if not exist %PREFIX%\share\compilers mkdir %PREFIX%\share\compilers  # [win]
        echo C compiler metapackage > %PREFIX%\share\compilers\c-compiler.txt  # [win]
    about:
      home: https://conda-forge.org
      license: BSD-3-Clause
      license_file: LICENSE.txt
      summary: A metapackage to obtain a C compiler
      description: |
        This package is a generic way to obtain the C compiler for your system
        that conda-forge used to compile its ecosystem.  This compiler is,
        therefore, guaranteed to be ABI compatible with the conda packages
        you have installed.

        This compiler metapackage is a convenience ONLY for users.
        Do NOT use this package as a build or host dependency in other
        recipes.  Use the Jinja template function compiler('c') instead.
    requirements:
      run:
        - {{ compiler('c') }}
        - binutils_aarch64     # [aarch64]
        - binutils_linux-64    # [linux-64]
        - gcc_linux-aarch64    # [aarch64]
        - gcc_linux-64         # [linux-64]
        - cctools >=949.0.1         # [osx]
        - ld64 >=530                # [osx]
        - llvm-openmp               # [osx]
    test:
      requires:
        - {{ compiler('c') }}
      files:
        - ${PREFIX}/share/compilers/c-compiler.txt
      commands:
        - test -f ${PREFIX}/share/compilers/c-compiler.txt  # [unix]
        - if exist %PREFIX%\share\compilers\c-compiler.txt (echo file exists) ELSE (echo file missing)  # [win]
        - $CC --help  # [unix]
        # Test only the environment variables for platform-specific commands
        - echo "C compiler environment variables:" # [linux]
        - echo $CC # [linux]
        - which $CC || echo "$CC not found in PATH" # [linux]
        - $CC --version # [linux]
        - echo "Testing Windows c-compiler"  # [win]
        - if defined CC (echo %CC% exists) ELSE (echo CC not defined)  # [win]
        - where cl  # [win]

  - name: cxx-compiler
    build:
      script: |
        # Create placeholder file to ensure package is not empty
        mkdir -p ${PREFIX}/share/compilers  # [unix]
        echo "C++ compiler metapackage" > ${PREFIX}/share/compilers/cxx-compiler.txt  # [unix]
        if not exist %PREFIX%\share\compilers mkdir %PREFIX%\share\compilers  # [win]
        echo C++ compiler metapackage > %PREFIX%\share\compilers\cxx-compiler.txt  # [win]
    about:
      home: https://conda-forge.org
      license: BSD-3-Clause
      license_file: LICENSE.txt
      summary: A metapackage to obtain a C++ compiler
      description: |
        This package is a generic way to obtain the C++ compiler for your system
        that conda-forge used to compile its ecosystem.  This compiler is,
        therefore, guaranteed to be ABI compatible with the conda packages
        you have installed.

        This compiler metapackage is a convenience ONLY for users.
        Do NOT use this package as a build or host dependency in other
        recipes.  Use the Jinja template function compiler('cxx') instead.
    requirements:
      run:
        - {{ compiler('cxx') }}
        - {{ pin_subpackage('c-compiler', exact=True) }}  # [unix]
        - gxx_linux-aarch64    # [aarch64]
        - gxx_linux-64         # [linux-64]
    test:
      requires:
        - {{ compiler('cxx') }}
      files:
        - ${PREFIX}/share/compilers/cxx-compiler.txt
      commands:
        - test -f ${PREFIX}/share/compilers/cxx-compiler.txt  # [unix]
        - if exist %PREFIX%\share\compilers\cxx-compiler.txt (echo file exists) ELSE (echo file missing)  # [win]
        - $CXX --help  # [unix]
        # Test only the environment variables for platform-specific commands
        - echo "C++ compiler environment variables:" # [linux]
        - echo $CXX # [linux] 
        - which $CXX || echo "$CXX not found in PATH" # [linux]
        - $CXX --version # [linux]
        - echo "Testing Windows cxx-compiler"  # [win]
        - if defined CXX (echo %CXX% exists) ELSE (echo CXX not defined)  # [win]
        - where cl  # [win]

  - name: fortran-compiler
    build:
      script: |
        # Create placeholder file to ensure package is not empty
        mkdir -p ${PREFIX}/share/compilers  # [unix]
        echo "Fortran compiler metapackage" > ${PREFIX}/share/compilers/fortran-compiler.txt  # [unix]
        if not exist %PREFIX%\share\compilers mkdir %PREFIX%\share\compilers  # [win]
        echo Fortran compiler metapackage > %PREFIX%\share\compilers\fortran-compiler.txt  # [win]
    about:
      home: https://conda-forge.org
      license: BSD-3-Clause
      license_file: LICENSE.txt
      summary: A metapackage to obtain a Fortran compiler
      description: |
        This package is a generic way to obtain the Fortran compiler for your
        system that conda-forge used to compile its ecosystem.  This compiler
        is, therefore, guaranteed to be ABI compatible with the conda packages
        you have installed.

        This compiler metapackage is a convenience ONLY for users.
        Do NOT use this package as a build or host dependency in other
        recipes.  Use the Jinja template function compiler('fortran') instead.
    requirements:
      run:
        - {{ compiler('fortran') }}
        - binutils_aarch64     # [aarch64]
        - binutils_linux-64    # [linux-64]
        - cctools >=949.0.1    # [osx]
        - ld64 >=530           # [osx]
        - llvm-openmp          # [osx]
        - {{ pin_subpackage('c-compiler', exact=True) }}  # [unix]
    test:
      requires:
        - {{ compiler('fortran') }}
      files:
        - ${PREFIX}/share/compilers/fortran-compiler.txt
      commands:
        - test -f ${PREFIX}/share/compilers/fortran-compiler.txt  # [unix]
        - if exist %PREFIX%\share\compilers\fortran-compiler.txt (echo file exists) ELSE (echo file missing)  # [win]
        - $FC --help  # [unix]
        # Test only the environment variables for platform-specific commands
        - echo "Fortran compiler environment variables:" # [linux]
        - echo $FC # [linux]
        - which $FC || echo "$FC not found in PATH" # [linux]
        - $FC --version # [linux]
        - echo "Testing Windows fortran-compiler"  # [win]
        - if defined FC (echo %FC% exists) ELSE (echo FC not defined)  # [win]
        - where ifort || echo ifort not in PATH  # [win]

  - name: compilers
    build:
      script: |
        # Create placeholder file to ensure package is not empty
        mkdir -p ${PREFIX}/share/compilers  # [unix]
        echo "Compilers metapackage" > ${PREFIX}/share/compilers/compilers.txt  # [unix]
        if not exist %PREFIX%\share\compilers mkdir %PREFIX%\share\compilers  # [win]
        echo Compilers metapackage > %PREFIX%\share\compilers\compilers.txt  # [win]
    about:
      home: https://conda-forge.org
      license: BSD-3-Clause
      license_file: LICENSE.txt
      summary: A metapackage to obtain compilers
    requirements:
      run:
        - {{ pin_subpackage('c-compiler', exact=True) }}
        - {{ pin_subpackage('cxx-compiler', exact=True) }}
        - {{ pin_subpackage('fortran-compiler', exact=True) }}
    test:
      files:
        - ${PREFIX}/share/compilers/compilers.txt
      commands:
        - test -f ${PREFIX}/share/compilers/compilers.txt  # [unix]
        - if exist %PREFIX%\share\compilers\compilers.txt (echo file exists) ELSE (echo file missing)  # [win]
        - echo "Testing compiler environment variables" # [unix]
        - echo $CC # [unix]
        - echo $CXX # [unix]
        - echo $FC # [unix]
        # Add Linux-specific tests to verify compiler path and version
        - which $CC || echo "$CC not found in PATH" # [linux]
        - which $CXX || echo "$CXX not found in PATH" # [linux]
        - which $FC || echo "$FC not found in PATH" # [linux]
        - echo "Testing Windows compilers metapackage"  # [win]
        - if defined CC (echo %CC% exists) ELSE (echo CC not defined)  # [win]
        - if defined CXX (echo %CXX% exists) ELSE (echo CXX not defined)  # [win]
        - if defined FC (echo %FC% exists) ELSE (echo FC not defined)  # [win]

about:
  home: https://conda-forge.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: A metapackage to obtain compilers
  description: |
    This package is a generic way to obtain the compilers for your system
    that conda-forge used to compile its ecosystem. These compilers are,
    therefore, guaranteed to be ABI compatible with the conda packages
    you have installed.

    These compiler metapackages are a convenience ONLY for users.
    Do NOT use these packages as a build or host dependencies in other
    recipes.  Use the compiler Jinja template function instead.
    For C++ for example, use compiler('cxx') instead.

extra:
  recipe-maintainers:
    - duncanmmacleod
    - scopatz
    - chrisburr
    - isuruf
  skip-lints:
    - should_use_compilers
    - compilers_must_be_in_build
    - outputs_not_unique
    - missing_dev_url
    - missing_tests
    - missing_documentation