{% set c_compiler = compiler('c').split('_')[0] %}
{% set cxx_compiler = compiler('cxx').split('_')[0] %}
{% set fortran_compiler = compiler('fortran').split('_')[0] %}

{% set commands = {
  'c-compiler': {
    'gcc': ['cc', 'cpp', 'gcc', 'gcc-ar', 'gcc-nm',
              'gcc-ranlib', 'gcov', 'gcov-dump', 'gcov-tool'],
    'clang': ['clang'],
    'vs2008': [],
    'vs2010': [],
    'vs2015': [],
    'vs2019': [],
  }[c_compiler],
  'cxx-compiler': {
    'gxx': ['g++', 'c++'],
    'clangxx': ['clang++'],
    'vs2008': [],
    'vs2010': [],
    'vs2015': [],
    'vs2019': [],
  }[cxx_compiler],
  'fortran-compiler': {
    'gfortran': ['gfortran'],
    'intel-fortran' : ['ifort'],
  }[fortran_compiler],
} %}


package:
  name: compilers
  version: 1.9.0

build:
   number: 0

outputs:
  - name: c-compiler
    about:
      home: https://conda-forge.org
      license: BSD-3-Clause
      license_file: LICENSE.txt
      summary: A metapackage to obtain a C compiler
      description: |
        This package is a generic way to obtain the C compiler for your system
        that conda-forge used to compile its ecosystem.  This compiler is,
        therefore, guaranteed to be ABI compatible with the conda packages
        you have installed.

        This compiler metapackage is a convenience ONLY for users.
        Do NOT use this package as a build or host dependency in other
        recipes.  Use the Jinja template function compiler('c') instead.
    requirements:
      run:
        - {{ compiler('c') }}
        - binutils             # [linux]
        - gcc_linux-aarch64    # [linux and aarch64]
        - gcc_linux-64         # [linux64]
        - clang_osx-arm64      # [osx and arm64]
        - clang_osx-64         # [osx and x86_64]
        - cctools >=949.0.1         # [osx]
        - ld64 >=530                # [osx]
        - llvm-openmp               # [osx]
    test:
      commands:
        - $CC --help  # [unix]
        # Linux-specific environment variable checks
        - echo "C compiler environment variables:" # [linux]
        - echo $CC # [linux]
        - test -f "$CC"  # [linux]
{%- for command in commands['c-compiler'] %}  # [unix and not linux]
        - {{ command }} --help > /dev/null  # [unix and not linux]
{%- endfor %}  # [unix and not linux]
        - echo "Testing Windows c-compiler"  # [win]
        - if defined CC (echo %CC% exists) ELSE (echo CC not defined & exit /b 1)  # [win]
        - where cl  # [win]

  - name: cxx-compiler
    about:
      home: https://conda-forge.org
      license: BSD-3-Clause
      license_file: LICENSE.txt
      summary: A metapackage to obtain a C++ compiler
      description: |
        This package is a generic way to obtain the C++ compiler for your system
        that conda-forge used to compile its ecosystem.  This compiler is,
        therefore, guaranteed to be ABI compatible with the conda packages
        you have installed.

        This compiler metapackage is a convenience ONLY for users.
        Do NOT use this package as a build or host dependency in other
        recipes.  Use the Jinja template function compiler('cxx') instead.
    requirements:
      run:
        - {{ compiler('cxx') }}
        - {{ pin_subpackage('c-compiler', exact=True) }}  # [unix]
        - gxx_linux-aarch64    # [linux and aarch64]
        - gxx_linux-64         # [linux64]
        - clangxx_osx-arm64    # [osx and arm64]
        - clangxx_osx-64       # [osx and x86_64]
    test:
      commands:
        - $CXX --help  # [unix]
        # Linux-specific environment variable checks
        - echo "C++ compiler environment variables:" # [linux]
        - echo $CXX # [linux] 
        - test -f "$CXX"  # [linux]
{%- for command in commands['cxx-compiler'] %}  # [unix and not linux]
        - {{ command }} --help > /dev/null  # [unix and not linux]
{%- endfor %}  # [unix and not linux]
        - echo "Testing Windows cxx-compiler"  # [win]
        - if defined CXX (echo %CXX% exists) ELSE (echo CXX not defined & exit /b 1)  # [win]
        - where cl  # [win]

  - name: fortran-compiler
    about:
      home: https://conda-forge.org
      license: BSD-3-Clause
      license_file: LICENSE.txt
      summary: A metapackage to obtain a Fortran compiler
      description: |
        This package is a generic way to obtain the Fortran compiler for your
        system that conda-forge used to compile its ecosystem.  This compiler
        is, therefore, guaranteed to be ABI compatible with the conda packages
        you have installed.

        This compiler metapackage is a convenience ONLY for users.
        Do NOT use this package as a build or host dependency in other
        recipes.  Use the Jinja template function compiler('fortran') instead.
    requirements:
      run:
        - {{ compiler('fortran') }}
        - binutils             # [linux]
        - gfortran_linux-aarch64  # [linux and aarch64]
        - gfortran_linux-64       # [linux64]
        - gfortran_osx-arm64      # [osx and arm64]
        - gfortran_osx-64         # [osx and x86_64]
        - cctools >=949.0.1    # [osx]
        - ld64 >=530           # [osx]
        - llvm-openmp          # [osx]
        - libgfortran5         # [unix]
        - {{ pin_subpackage('c-compiler', exact=True) }}  # [linux]
    test:
      commands:
        - $FC --help  # [unix]
        # Linux-specific environment variable checks
        - echo "Fortran compiler environment variables:" # [linux]
        - echo $FC # [linux]
        - test -f "$FC"  # [linux]
{%- for command in commands['fortran-compiler'] %}  # [unix and not linux]
        - {{ command }} --help > /dev/null  # [unix and not linux]
{%- endfor %}  # [unix and not linux]
        - echo "Testing Windows fortran-compiler"  # [win]
        - where ifort || (echo ifort not in PATH & exit /b 1)  # [win]

  - name: compilers
    about:
      home: https://conda-forge.org
      license: BSD-3-Clause
      license_file: LICENSE.txt
      summary: A metapackage to obtain compilers
      description: |
        This package is a generic way to obtain the C, C++ and Fortran compilers for your system
        that Anaconda used to compile its ecosystem.  This compiler is,
        therefore, guaranteed to be ABI compatible with the conda packages
        you have installed.

        This compiler metapackage is a convenience ONLY for users.
        Do NOT use this package as a build or host dependency in other
        recipes.  Use the Jinja template functions compiler('c'), compiler('cxx') and compiler('fortran') instead.
    requirements:
      run:
        - {{ pin_subpackage('c-compiler', exact=True) }}
        - {{ pin_subpackage('cxx-compiler', exact=True) }}
        - {{ pin_subpackage('fortran-compiler', exact=True) }}
    test:
      commands:
        - $CC --help  # [unix]
        - $CXX --help  # [unix]
        - $FC --help  # [unix]
        # Add Linux-specific tests
        - echo "Compiler environment variables:" # [linux]
        - echo $CC # [linux]
        - echo $CXX # [linux]
        - echo $FC # [linux]
        - echo "Testing Windows compilers metapackage"  # [win]
        - if defined CC (echo %CC% exists) ELSE (echo CC not defined & exit /b 1)  # [win]
        - if defined CXX (echo %CXX% exists) ELSE (echo CXX not defined & exit /b 1)  # [win]

about:
  home: https://conda-forge.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: A metapackage to obtain compilers
  description: |
    This package is a generic way to obtain the compilers for your system
    that conda-forge used to compile its ecosystem. These compilers are,
    therefore, guaranteed to be ABI compatible with the conda packages
    you have installed.

    These compiler metapackages are a convenience ONLY for users.
    Do NOT use these packages as a build or host dependencies in other
    recipes.  Use the compiler Jinja template function instead.
    For C++ for example, use compiler('cxx') instead.

extra:
  recipe-maintainers:
    - duncanmmacleod
    - scopatz
    - chrisburr
    - isuruf
  skip-lints:
    - should_use_compilers
    - compilers_must_be_in_build
    - outputs_not_unique
    - missing_dev_url
    - missing_tests
    - missing_documentation